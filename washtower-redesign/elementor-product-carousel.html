<!-- WASHTOWER: featured product carousel for an Elementor HTML widget.
     Loads real WooCommerce products from the Store API (featured first) and adds to basket via WooCommerce AJAX.
     Settings: data-shop (shop page URL), data-limit (max products). If the store can't be reached, a clearly labelled demo mode is shown. -->
<section class="wtpc" data-limit="8" data-shop="/shop/" aria-labelledby="wtpc-title">
  <div class="wtpc__in">
    <header class="wtpc__head">
      <div>
        <p class="wtpc__sub wtpc__rv">Featured products</p>
        <h2 id="wtpc-title" class="wtpc__title wtpc__rv">Our most popular cabinets</h2>
      </div>
      <a class="wtpc__all wtpc__rv" href="/shop/">View all products <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </header>

    <div class="wtpc__car">
      <button type="button" class="wtpc__nav wtpc__nav--prev" aria-label="Previous products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="wtpc__view" tabindex="0" aria-roledescription="carousel" aria-label="Featured products">
        <ul class="wtpc__track" aria-live="off">
          <!-- skeleton placeholders while products load -->
          <li class="wtpc__card wtpc__card--sk"><div class="wtpc__img"></div><div class="wtpc__body"><span class="wtpc__skl"></span><span class="wtpc__skl wtpc__skl--s"></span><span class="wtpc__btn" aria-hidden="true"></span></div></li>
          <li class="wtpc__card wtpc__card--sk"><div class="wtpc__img"></div><div class="wtpc__body"><span class="wtpc__skl"></span><span class="wtpc__skl wtpc__skl--s"></span><span class="wtpc__btn" aria-hidden="true"></span></div></li>
          <li class="wtpc__card wtpc__card--sk"><div class="wtpc__img"></div><div class="wtpc__body"><span class="wtpc__skl"></span><span class="wtpc__skl wtpc__skl--s"></span><span class="wtpc__btn" aria-hidden="true"></span></div></li>
          <li class="wtpc__card wtpc__card--sk"><div class="wtpc__img"></div><div class="wtpc__body"><span class="wtpc__skl"></span><span class="wtpc__skl wtpc__skl--s"></span><span class="wtpc__btn" aria-hidden="true"></span></div></li>
        </ul>
      </div>
      <button type="button" class="wtpc__nav wtpc__nav--next" aria-label="Next products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>

    <div class="wtpc__dots" role="tablist" aria-label="Choose slide"></div>
    <p class="wtpc__msg" role="status" aria-live="polite"></p>
  </div>
</section>

<style>
.wtpc{--g:#284B3D;--g2:#33604E;--tx:#242424;--mut:#909090;--gold:#E5A500;--ln:#E7E7E3;--ease:cubic-bezier(.22,1,.36,1);background:#fff;padding:clamp(48px,5vw,80px) 20px;box-sizing:border-box;width:100%;overflow:hidden}
.wtpc *,.wtpc *:before,.wtpc *:after{box-sizing:border-box}
.wtpc__in{max-width:1200px;margin:0 auto;position:relative}
.wtpc__head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}
.wtpc .wtpc__sub{margin:0 0 6px;font:500 11px/1.2 'Barlow','Helvetica Neue',Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.wtpc .wtpc__title{margin:0;font:500 clamp(26px,2.4vw,34px)/1.15 Georgia,'Times New Roman',serif!important;color:var(--tx);letter-spacing:-.01em}
.wtpc .wtpc__all{display:inline-flex;align-items:center;gap:8px;font:600 13px/1 'Barlow','Helvetica Neue',Arial,sans-serif;color:var(--tx);text-decoration:none;padding:6px 0;white-space:nowrap}
.wtpc__all svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
.wtpc__all:hover{color:var(--g)}.wtpc__all:hover svg{transform:translateX(5px)}

.wtpc__car{position:relative}
.wtpc__view{overflow:hidden;touch-action:pan-y;outline:none;padding:6px 2px 10px;margin:-6px -2px -10px}
.wtpc__view:focus-visible{box-shadow:0 0 0 2px var(--g);border-radius:10px}
.wtpc__track{list-style:none;margin:0;padding:0;display:flex;gap:var(--gap,16px);transition:transform .45s var(--ease);will-change:transform;cursor:grab}
.wtpc.is-drag .wtpc__track{transition:none;cursor:grabbing}
.wtpc.is-drag .wtpc__track a{pointer-events:none}
.wtpc__card{flex:0 0 calc((100% - (var(--per,4) - 1) * var(--gap,16px)) / var(--per,4));min-width:0;margin:0;background:#fff;border:1px solid var(--ln);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease)}
.wtpc__img{display:block;position:relative;aspect-ratio:4/3;background:#F1F0EC;overflow:hidden}
.wtpc__img img{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none!important;object-fit:cover;border-radius:0!important;transition:transform .5s var(--ease)}
.wtpc__body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.wtpc .wtpc__name{margin:0;font:600 14px/1.3 'Barlow','Helvetica Neue',Arial,sans-serif!important;color:var(--tx);letter-spacing:0}
.wtpc__name a{color:inherit;text-decoration:none}.wtpc__name a:hover{color:var(--g)}
.wtpc__rate{display:flex;align-items:center;gap:5px;font:400 11.5px/1 'Barlow',Arial,sans-serif;color:var(--mut);min-height:14px}
.wtpc__stars{position:relative;display:inline-block;font-size:11px;letter-spacing:1px;line-height:1;color:#DADAD5}
.wtpc__stars span{position:absolute;inset:0;overflow:hidden;color:var(--gold);white-space:nowrap}
.wtpc__price{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:2px}
.wtpc__now{font:700 18px/1 'Barlow','Helvetica Neue',Arial,sans-serif;color:var(--tx)}
.wtpc__was{font:400 12px/1 'Barlow',Arial,sans-serif;color:var(--mut);text-decoration:line-through}
.wtpc__btn{margin-top:8px;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:36px;border:0;border-radius:6px;background:var(--g);color:#fff!important;font:600 12.5px/1 'Barlow','Helvetica Neue',Arial,sans-serif;text-decoration:none!important;cursor:pointer;overflow:hidden;transition:background-color .3s var(--ease),box-shadow .3s var(--ease)}
.wtpc__btn>span{display:inline-flex;align-items:center;gap:8px;transition:transform .3s var(--ease)}
.wtpc__btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transform-origin:50% 90%}
.wtpc__btn:hover{background:var(--g2)}
.wtpc__btn:hover>span{transform:translateY(-1px)}
.wtpc__btn:hover svg{animation:wtpcBasket .7s var(--ease)}
.wtpc__btn:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.wtpc__btn.is-loading{pointer-events:none;background:var(--g2)}
.wtpc__btn.is-loading>span{opacity:0}
.wtpc__btn.is-loading:after{content:"";position:absolute;width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:wtpcSpin .7s linear infinite}
.wtpc__btn.is-done{background:#2F6B4F}
.wtpc__btn.is-error{background:#8C3B2C}
@keyframes wtpcSpin{to{transform:rotate(360deg)}}
@keyframes wtpcBasket{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg) translateY(-1px)}60%{transform:rotate(8deg)}}

@media (hover:hover){
  .wtpc__card:not(.wtpc__card--sk):hover{transform:translateY(-5px);box-shadow:0 18px 34px -22px rgba(30,45,38,.45);border-color:#D3D8D2}
  .wtpc__card:hover .wtpc__img img{transform:scale(1.04)}
}

.wtpc__nav{position:absolute;top:var(--navtop,38%);transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid #D9D9D4!important;background:#fff!important;color:var(--tx)!important;display:grid;place-items:center;padding:0!important;cursor:pointer;box-shadow:0 4px 12px -6px rgba(0,0,0,.2);transition:transform .3s var(--ease),border-color .3s,opacity .3s}
.wtpc__nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.wtpc__nav--prev{left:-54px}.wtpc__nav--next{right:-54px}
.wtpc__nav:hover{transform:translateY(-50%) scale(1.08);border-color:var(--g)!important;color:var(--g)!important}
.wtpc__nav--prev:hover svg{transform:translateX(-2px)}.wtpc__nav--next:hover svg{transform:translateX(2px)}
.wtpc__nav:disabled{opacity:.35;pointer-events:none}

.wtpc__dots{display:flex;justify-content:center;gap:8px;margin-top:22px;min-height:8px}
.wtpc__dots button{width:7px;height:7px;padding:0!important;border:0!important;border-radius:999px;background:#D3D3CF!important;cursor:pointer;transition:width .35s var(--ease),background-color .35s}
.wtpc__dots button[aria-selected="true"]{width:20px;background:var(--g)!important}
.wtpc__msg{margin:14px 0 0;text-align:center;font:500 13px/1.4 'Barlow',Arial,sans-serif;color:var(--g);min-height:18px}
.wtpc__msg.is-err{color:#8C3B2C}
.wtpc__msg a{color:inherit;font-weight:700}
.wtpc .screen-reader-text{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap}
.wtpc__demo{display:inline-block;margin-left:10px;padding:3px 8px;border-radius:4px;background:#FFF4D6;color:#7A5A00;font:600 10px/1.2 'Barlow',Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}

/* skeleton */
.wtpc__card--sk .wtpc__img{background:linear-gradient(100deg,#F1F0EC 40%,#F8F7F4 50%,#F1F0EC 60%) 0 0/200% 100%;animation:wtpcSk 1.2s linear infinite}
.wtpc__skl{display:block;height:12px;border-radius:4px;background:#F1F0EC;width:70%}.wtpc__skl--s{width:40%}
@keyframes wtpcSk{to{background-position:-200% 0}}

/* scroll reveal */
.wtpc.wtpc--anim .wtpc__rv{opacity:0;transform:translateY(16px);transition:opacity .65s var(--ease),transform .65s var(--ease)}
.wtpc.wtpc--anim .wtpc__sub{transform:none}
.wtpc.wtpc--anim .wtpc__card{opacity:0;translate:0 22px;transition:opacity .65s var(--ease),translate .65s var(--ease),transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease);transition-delay:calc(var(--i,0) * 100ms + .15s),calc(var(--i,0) * 100ms + .15s),0s,0s,0s}
.wtpc.wtpc--in .wtpc__rv{opacity:1;transform:none}
.wtpc.wtpc--in .wtpc__title{transition-delay:.08s}
.wtpc.wtpc--in .wtpc__card{opacity:1;translate:0 0}

@media (max-width:1280px){.wtpc__nav--prev{left:-18px}.wtpc__nav--next{right:-18px}}
@media (max-width:1024px){.wtpc{--per:2}.wtpc__track{--gap:14px}}
@media (max-width:767px){
  .wtpc{padding:48px 16px}
  .wtpc__head{align-items:flex-start;flex-direction:column;gap:10px}
  .wtpc .wtpc__title{font-size:26px!important}
  .wtpc__view{overflow:visible}
  .wtpc__nav{width:34px;height:34px}.wtpc__nav--prev{left:-8px}.wtpc__nav--next{right:-8px}
  .wtpc__btn{height:42px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){
  .wtpc *,.wtpc *:before,.wtpc *:after{animation:none!important;transition:none!important}
  .wtpc .wtpc__rv,.wtpc .wtpc__card{opacity:1!important;transform:none!important;translate:none!important}
}
</style>

<script>
(function(){
  var DEMO=[ /* shown ONLY if the WooCommerce Store API cannot be reached; clearly labelled "Demo" */
    {name:'Twin Collection A2',price:'£1,299'},{name:'Galley Wall L5',price:'£1,499'},{name:'Slimline S4',price:'£999'},{name:'Utility Cabinet U3',price:'£1,399'}
  ];
  var BASKET='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function money(p,v){if(v==null||v==='')return '';var m=+p.currency_minor_unit||0,n=(+v)/Math.pow(10,m);return (p.currency_prefix||'')+n.toLocaleString('en-GB',{minimumFractionDigits:m,maximumFractionDigits:m})+(p.currency_suffix||'');}
  function decode(s){var t=document.createElement('textarea');t.innerHTML=s;return t.value;}

  document.querySelectorAll('.wtpc:not([data-wtpc-ready])').forEach(function(root){
    root.setAttribute('data-wtpc-ready','1');
    var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var base=(window.wc_add_to_cart_params&&wc_add_to_cart_params.wc_ajax_url)?null:location.origin;
    var view=root.querySelector('.wtpc__view'),track=root.querySelector('.wtpc__track'),dots=root.querySelector('.wtpc__dots'),msg=root.querySelector('.wtpc__msg');
    var prev=root.querySelector('.wtpc__nav--prev'),next=root.querySelector('.wtpc__nav--next');
    var shop=root.getAttribute('data-shop')||'/shop/',limit=parseInt(root.getAttribute('data-limit'),10)||8;
    root.querySelector('.wtpc__all').setAttribute('href',shop);
    var idx=0,per=4,cards=[];

    /* ---------- carousel ---------- */
    function perView(){var w=window.innerWidth;return w<=767?1.15:(w<=1024?2:4);}
    function maxIdx(){return Math.max(0,Math.ceil(cards.length-per));}
    function stepPx(){if(!cards[0])return 0;var g=parseFloat(getComputedStyle(track).columnGap||getComputedStyle(track).gap)||16;return cards[0].getBoundingClientRect().width+g;}
    function render(anim){
      var m=maxIdx();idx=Math.max(0,Math.min(idx,m));
      var x=idx*stepPx();if(idx===m&&per%1){x=Math.max(0,track.scrollWidth-view.clientWidth);}
      if(anim===false){track.style.transition='none';}
      track.style.transform='translate3d('+(-x)+'px,0,0)';
      if(anim===false){track.offsetHeight;track.style.transition='';}
      prev.disabled=idx<=0;next.disabled=idx>=m;
      Array.prototype.forEach.call(dots.children,function(d,i){d.setAttribute('aria-selected',i===idx?'true':'false');d.tabIndex=i===idx?0:-1;});
      cards.forEach(function(c,i){var vis=i>=idx&&i<idx+Math.ceil(per);c.setAttribute('aria-hidden',vis?'false':'true');c.querySelectorAll('a,button').forEach(function(el){el.tabIndex=vis?0:-1;});});
    }
    function buildDots(){
      dots.innerHTML='';var m=maxIdx();
      for(var i=0;i<=m;i++){(function(i){var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-label','Go to slide '+(i+1));b.addEventListener('click',function(){idx=i;render();});dots.appendChild(b);})(i);}
      dots.style.display=m>0?'':'none';
    }
    function layout(){per=perView();root.style.setProperty('--per',per);buildDots();render(false);
      var img=root.querySelector('.wtpc__img');if(img){root.style.setProperty('--navtop',(img.offsetTop+img.offsetHeight/2+6)+'px');}}
    prev.addEventListener('click',function(){idx--;render();});
    next.addEventListener('click',function(){idx++;render();});
    view.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){idx++;render();e.preventDefault();}if(e.key==='ArrowLeft'){idx--;render();e.preventDefault();}});
    var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,120);});

    /* drag + swipe (pointer events cover mouse and touch) */
    var sx=0,sy=0,dx=0,start=0,drag=false,lock=null,moved=false;
    view.addEventListener('pointerdown',function(e){if(e.button>0||!cards.length)return;sx=e.clientX;sy=e.clientY;dx=0;lock=null;moved=false;drag=true;var t=getComputedStyle(track).transform;start=t&&t!=='none'?parseFloat(t.split(',')[4]):0;});
    window.addEventListener('pointermove',function(e){if(!drag)return;var mx=e.clientX-sx,my=e.clientY-sy;if(lock===null&&(Math.abs(mx)>6||Math.abs(my)>6)){lock=Math.abs(mx)>Math.abs(my)?'x':'y';if(lock==='x'){root.classList.add('is-drag');try{view.setPointerCapture(e.pointerId);}catch(_){}}}
      if(lock!=='x')return;moved=true;dx=mx;var m=maxIdx(),edge=(idx<=0&&dx>0)||(idx>=m&&dx<0);track.style.transform='translate3d('+(start+(edge?dx*.35:dx))+'px,0,0)';});
    function end(){if(!drag)return;drag=false;root.classList.remove('is-drag');if(lock==='x'){var s=stepPx(),n=Math.round(Math.abs(dx)/s)||(Math.abs(dx)>40?1:0);idx+=dx<0?n:-n;}render();}
    window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
    view.addEventListener('click',function(e){if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);
    view.addEventListener('dragstart',function(e){e.preventDefault();});

    /* ---------- products ---------- */
    function card(p,i){
      var img=(p.images&&p.images[0])||{},pr=p.prices||{},onSale=pr.sale_price&&pr.regular_price&&pr.sale_price!==pr.regular_price;
      var simple=p.type==='simple'&&p.is_purchasable&&p.is_in_stock!==false;
      var rating=parseFloat(p.average_rating)||0,count=parseInt(p.review_count,10)||0;
      var li=document.createElement('li');li.className='wtpc__card';li.style.setProperty('--i',i);
      li.innerHTML='<a class="wtpc__img" href="'+esc(p.permalink)+'" tabindex="-1" aria-hidden="true">'+(img.src?'<img src="'+esc(img.src)+'"'+(img.srcset?' srcset="'+esc(img.srcset)+'" sizes="(max-width:767px) 85vw,(max-width:1024px) 48vw,300px"':'')+' alt="'+esc(img.alt||decode(p.name))+'" loading="lazy" decoding="async">':'')+'</a>'+
        '<div class="wtpc__body"><h3 class="wtpc__name"><a href="'+esc(p.permalink)+'">'+esc(decode(p.name))+'</a></h3>'+
        '<div class="wtpc__rate">'+(count?'<span class="wtpc__stars" aria-label="Rated '+rating.toFixed(1)+' out of 5">&#9733;&#9733;&#9733;&#9733;&#9733;<span style="width:'+(rating/5*100)+'%">&#9733;&#9733;&#9733;&#9733;&#9733;</span></span><span>'+rating.toFixed(1)+' ('+count+')</span>':'')+'</div>'+
        '<div class="wtpc__price"><span class="wtpc__now">'+esc(money(pr,pr.price))+'</span>'+(onSale?'<span class="wtpc__was"><span class="screen-reader-text">Was </span>'+esc(money(pr,pr.regular_price))+'</span>':'')+'</div>'+
        (simple?'<button type="button" class="wtpc__btn" data-id="'+p.id+'" data-name="'+esc(decode(p.name))+'"><span>'+BASKET+'Add to basket</span></button>'
               :'<a class="wtpc__btn" href="'+esc(p.permalink)+'"><span>'+BASKET+'Choose options</span></a>')+'</div>';
      return li;
    }
    function demoCard(d,i){var li=document.createElement('li');li.className='wtpc__card';li.style.setProperty('--i',i);
      li.innerHTML='<div class="wtpc__img"></div><div class="wtpc__body"><h3 class="wtpc__name">'+esc(d.name)+'</h3><div class="wtpc__rate"></div><div class="wtpc__price"><span class="wtpc__now">'+esc(d.price)+'</span></div><button type="button" class="wtpc__btn" data-demo="1"><span>'+BASKET+'Add to basket</span></button></div>';return li;}
    function mount(list,isDemo){
      track.innerHTML='';list.forEach(function(p,i){track.appendChild(isDemo?demoCard(p,i):card(p,i));});
      cards=Array.prototype.slice.call(track.children);
      if(isDemo){root.querySelector('.wtpc__title').insertAdjacentHTML('beforeend','<span class="wtpc__demo">Demo data</span>');}
      layout();
    }
    var api=location.origin+'/wp-json/wc/store/v1/products';
    function get(q){return fetch(api+q,{credentials:'same-origin',headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
    get('?featured=true&orderby=date&order=asc&per_page='+limit).then(function(f){
      if(f.length>=limit)return f;
      return get('?per_page='+(limit+f.length)+'&orderby=date&order=desc').then(function(all){var ids=f.map(function(p){return p.id;});return f.concat(all.filter(function(p){return ids.indexOf(p.id)<0;})).slice(0,limit);});
    }).then(function(list){if(!list.length)throw new Error('empty');mount(list,false);})
      .catch(function(){mount(DEMO,true);});

    /* ---------- add to basket (WooCommerce AJAX) ---------- */
    function say(html,err){msg.innerHTML=html;msg.classList.toggle('is-err',!!err);clearTimeout(say.t);say.t=setTimeout(function(){msg.innerHTML='';},6000);}
    function applyFragments(fr){if(!fr)return;Object.keys(fr).forEach(function(sel){document.querySelectorAll(sel).forEach(function(el){var t=document.createElement('div');t.innerHTML=fr[sel];if(t.firstElementChild)el.replaceWith(t.firstElementChild);});});}
    track.addEventListener('click',function(e){
      var b=e.target.closest('button.wtpc__btn');if(!b||!track.contains(b))return;
      if(b.getAttribute('data-demo')){say('Demo mode: WooCommerce is not connected, nothing was added.',true);return;}
      var label=b.innerHTML;b.classList.add('is-loading');b.setAttribute('aria-busy','true');
      var url=(window.wc_add_to_cart_params&&wc_add_to_cart_params.wc_ajax_url)?wc_add_to_cart_params.wc_ajax_url.toString().replace('%%endpoint%%','add_to_cart'):location.origin+'/?wc-ajax=add_to_cart';
      var fd=new FormData();fd.append('product_id',b.getAttribute('data-id'));fd.append('quantity','1');
      fetch(url,{method:'POST',body:fd,credentials:'same-origin'}).then(function(r){return r.json();}).then(function(res){
        if(!res||res.error||!res.fragments){throw res&&res.product_url?{url:res.product_url}:new Error('failed');}
        applyFragments(res.fragments);
        if(window.jQuery){jQuery(document.body).trigger('wc_fragment_refresh').trigger('added_to_cart',[res.fragments,res.cart_hash,jQuery(b)]);}
        b.classList.remove('is-loading');b.classList.add('is-done');b.innerHTML='<span>&#10003; Added</span>';
        var cart=(window.wc_add_to_cart_params&&wc_add_to_cart_params.cart_url)||(location.origin+'/cart/');
        say(esc(b.getAttribute('data-name'))+' was added to your basket. <a href="'+esc(cart)+'">View basket</a>');
      }).catch(function(err){
        b.classList.remove('is-loading');b.classList.add('is-error');b.innerHTML='<span>Try again</span>';
        say(err&&err.url?'This product needs options. <a href="'+esc(err.url)+'">Choose options</a>':'Sorry, it could not be added to your basket. Please try again.',true);
      }).then(function(){setTimeout(function(){b.classList.remove('is-done','is-error');b.removeAttribute('aria-busy');b.innerHTML=label;},2200);});
    });

    /* ---------- scroll reveal (once) ---------- */
    var inEditor=document.body.classList.contains('elementor-editor-active')||/[?&]elementor-preview=/.test(location.search);
    if(!reduce&&!inEditor&&'IntersectionObserver' in window){
      root.classList.add('wtpc--anim');
      var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){root.classList.add('wtpc--in');io.disconnect();}});},{threshold:.15});
      io.observe(root);
    }
  });
})();
</script>
